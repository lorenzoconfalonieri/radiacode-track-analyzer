[build-system]
# 77 is where PEP 639 license expressions land; the SPDX string below needs it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rcta"
# Defined once, in rcta/__init__.py; the GPX creator, the About box, the
# CLI's --version and the User-Agent all read it from there.
dynamic = ["version"]
description = "Radiacode Track Analyzer - GPS radiation track analysis for handheld CsI(Tl) scintillators"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lorenzo Confalonieri"}]
license = "MIT"
# The bundled airport table is ODbL rather than MIT, because its timezone
# column derives from OpenFlights and share-alike follows the data. Both
# files ship in the wheel so the terms travel with what they cover.
license-files = ["LICENSE", "NOTICE", "src/rcta/data/LICENSE"]
keywords = ["radiacode", "gamma-spectrometry", "dosimetry", "gps",
            "scintillator", "cosmic-rays"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# tzdata only where the OS ships no zone database of its own: --date is a
# calendar day at the departure airport, and zoneinfo cannot resolve one on
# Windows without it.
dependencies = ["numpy>=1.26", "scipy>=1.11",
                "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
# PySide6 6.12.0 drops a reference to None on every QWidget it destroys (and
# on calls passing None, such as sendPostedEvents(None, ...)). On Python 3.12
# None is immortal and nothing happens; on 3.10 on Linux the count reaches
# zero after about a dozen windows and the interpreter aborts with
# "none_dealloc: deallocating None". 6.11.2 and earlier are clean.
gui = ["PySide6>=6.8,!=6.12.0; python_version < '3.11'",
       "PySide6>=6.8; python_version >= '3.11'",
       "pyqtgraph>=0.13.7"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
rcta = "rcta.gui.app:main"
rcta-cli = "rcta.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rcta.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rcta.data" = ["*.json", "LICENSE"]
"rcta.gui" = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# zip() without strict= is everywhere and correct here; flagging each call
# is noise, not a finding.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# The application stylesheet: one CSS rule per line reads better than wrapped.
"src/rcta/gui/theme.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rcta"]
