# Lint and the full test suite, headless, on every push and pull request.
#
# Windows is in the matrix on purpose: the encoding fixes of October 2026
# (attribution text read as cp1252, tracks read with the locale default)
# are exactly what a UTF-8 developer machine never sees.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[gui,dev]"
      - name: Lint
        run: ruff check src tests tools packaging
      - name: Test
        run: python -X faulthandler -m pytest -v -p no:cacheprovider --capture=sys
